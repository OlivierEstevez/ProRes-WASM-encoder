name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (decode checks)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build (WASM via Docker + JS)
        run: npm run build
      - run: npm test
      - name: Browser tests (Vite + Chromium)
        if: matrix.node == 22
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
